services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_visual_carrer_front
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5400}:5400"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VITE_API_TARGET=${VITE_API_TARGET:-http://host.docker.internal:8001}
